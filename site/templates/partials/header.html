    <a class="skip" href="#main">{{t.nav.skip}}</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{links.home}}" aria-label="{{t.nav.home}}">
          <img class="brand__mark" src="{{asset "assets/icon.svg"}}" width="26" height="26" alt="">
          <span class="brand__name">SC Trade</span>
        </a>
        <input class="menu-toggle" type="checkbox" id="menu-toggle" aria-label="{{t.nav.menu}}">
        <label class="menu-button" for="menu-toggle" aria-hidden="true"><span class="menu-button__bars"></span><span class="menu-button__text">{{t.nav.menu}}</span></label>
        <nav class="site-nav" aria-label="{{t.nav.sections}}">
          <a href="{{links.anchor}}features">{{t.nav.features}}</a>
{{#if flags.pictures}}          <a href="{{links.anchor}}gallery">{{t.nav.gallery}}</a>
{{/if}}          <a href="{{links.anchor}}safety">{{t.nav.safety}}</a>
          <a href="{{links.anchor}}download">{{t.nav.download}}</a>
          <a href="{{links.anchor}}feedback">{{t.nav.feedback}}</a>
          <a href="{{links.anchor}}support">{{t.nav.support}}</a>
        </nav>
        <div class="lang" role="group" aria-label="{{t.nav.language}}">
{{#each langs}}{{#if current}}          <span class="lang__item is-current" aria-current="true" lang="{{code}}">{{label}}</span>
{{else}}          <a class="lang__item" href="{{href}}" hreflang="{{code}}" lang="{{code}}">{{label}}</a>
{{/if}}{{/each}}        </div>
      </div>
    </header>
