# SC Trade - the error log of the web server (Caddy) is kept for 30 days at the most.
#
# The page of the site about data promises it: when Caddy fails on a request, it writes the address the request came
# from into this log, and that address must not stay there longer. Caddy itself turns a log over only when it grows
# big, which this one may never do, so it is done here, by the day: every day the log is put aside and begun anew,
# and a part that was put aside 28 times - 29 days old at the most - is removed.
#
# setup.sh puts this file at /etc/logrotate.d/sc-trade-site. To see what it would do, without doing it:
#   logrotate --debug /etc/logrotate.d/sc-trade-site
/var/log/caddy/sc-trade-error.log {
	su caddy caddy
	daily
	rotate 28
	maxage 30
	ifempty
	missingok
	copytruncate
	nocompress
	nodateext
}
