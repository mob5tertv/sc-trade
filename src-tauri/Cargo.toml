[package]
name = "sc-trade"
version = "1.3.0"
description = "Price diary and trade-route helper overlay for Star Citizen, with UEX data"
authors = ["mob5tertv"]
license = "MIT"
repository = "https://github.com/mob5tertv/sc-trade"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sc_trade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
# No default features: they include `cookies`, a persistent cookie jar that the application has no use
# for. The rest of the defaults are listed again, so that TLS (rustls), HTTP/2, charset decoding and the
# system proxy (the player may reach UEX through a VPN) stay exactly as they were.
tauri-plugin-http = { version = "2.8.0", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "gzip", "brotli"] }
tauri-plugin-os = "2.4.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"

# Foreground-window handling (focus.rs) and the keyboard hook (input_hook.rs) are Windows-only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
